set timeout=0
set default=0

insmod vbe
insmod vga
insmod video_bochs
insmod video_cirrus

# Force a 32-bit-per-pixel framebuffer (x32 depth): the graphics library and lfb
# assume 4-byte pixels, so a 24bpp mode (pitch = width*3) would mis-stride.
set gfxmode=1024x768x32

serial --unit=0 --speed=115200
insmod gfxterm
terminal_input console serial
terminal_output gfxterm serial

# Boots with "cardinal.gfxdemo": after the display comes up, init draws a UI demo
# frame (graphics.clp + font.clp) into the framebuffer and flushes it -- the
# end-to-end proof of the graphics API. Capture it with run-qemu.sh SCREENSHOT=.
menuentry "Cardinal (graphics demo)" {
	multiboot2 /boot/kernel.bin cardinal.gfxdemo
	module2 /boot/initrd
	set gfxpayload=1024x768x32,800x600x32,1024x768,800x600
}
