set timeout=0
set default=0

insmod vbe
insmod vga
insmod video_bochs
insmod video_cirrus

set gfxmode=1024x768

# Serial console (COM1, 115200). The kernel switches COM1 into framed CSMUX once
# the REPL comes up, so a host demuxer (scripts/csmux-repl.py) is needed to read
# the log and talk to the REPL over this one link.
serial --unit=0 --speed=115200
insmod gfxterm
terminal_input console serial
terminal_output gfxterm serial

# Boots with "cardinal.repl": SysLisp activates CSMUX (log -> ch0, REPL <-> ch2)
# and brings up the interactive serial REPL, which parks on COM1 RX (IRQ 4).
menuentry "Cardinal (REPL mode)" {
	multiboot2 /boot/kernel.bin cardinal.repl
	module2 /boot/initrd
	set gfxpayload=1024x768,800x600,640x480
}
