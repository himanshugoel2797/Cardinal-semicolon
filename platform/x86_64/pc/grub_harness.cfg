set timeout=0
set default=0

insmod vbe
insmod vga
insmod video_bochs
insmod video_cirrus

set gfxmode=1024x768

# Serial console for the harness-driven death-test run (COM1, 115200). COM1
# carries CSMUX-framed traffic once SysTest activates the mux; the boot/GRUB text
# before that stays raw and the host harness (scripts/systest-harness.py) shows
# it verbatim before switching to the de-framer.
serial --unit=0 --speed=115200
insmod gfxterm
terminal_input console serial
terminal_output gfxterm serial

# Boots in test mode AND harness mode: "cardinal.test" enables SysTest, the extra
# "cardinal.harness" token makes SysTest activate CSMUX, perform the control-
# channel handshake, and run the death tests one-per-reboot under the host
# harness. Without the harness listening this degrades to skipping death tests.
menuentry "Cardinal (death-test / harness mode)" {
	multiboot2 /boot/kernel.bin cardinal.test cardinal.harness
	module2 /boot/initrd
	set gfxpayload=1024x768,800x600,640x480
}
