set timeout=0
set default=0

insmod vbe
insmod vga
insmod video_bochs
insmod video_cirrus

set gfxmode=1024x768

# Serial console for headless test runs (COM1, 115200).
serial --unit=0 --speed=115200
insmod gfxterm
terminal_input console serial
terminal_output gfxterm serial

# Boots the kernel in test mode: the "cardinal.test" cmdline flag makes SysTest's
# test_run_all() (wired into servicescript.txt) run the registered tests and exit
# the machine via QEMU's isa-debug-exit device. See scripts/run-tests-qemu.sh.
menuentry "Cardinal (test mode)" {
	multiboot2 /boot/kernel.bin cardinal.test
	module2 /boot/initrd
	set gfxpayload=1024x768,800x600,640x480
}
