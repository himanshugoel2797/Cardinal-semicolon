set timeout=0
set default=0

insmod vbe
insmod vga
insmod video_bochs
insmod video_cirrus

# Force a 32-bit-per-pixel framebuffer (x32 depth): the graphics library and lfb
# assume 4-byte pixels, so a 24bpp mode (pitch = width*3) would mis-stride.
set gfxmode=1920x1080x32

serial --unit=0 --speed=115200
insmod gfxterm
terminal_input console serial
terminal_output gfxterm serial

# Boots with "cardinal.compositordemo": after the display comes up, init brings up
# the window compositor OWNING the real scanout (notes/servers/CoreCompositor.md
# phase 4) and a client connects, creates a surface, draws a titled window into its
# granted backing, and commits -- so a composited window appears on the real display
# via the compositor's flush-rects path. Capture it with run-qemu.sh SCREENSHOT=.
menuentry "Cardinal (compositor demo)" {
	multiboot2 /boot/kernel.bin cardinal.compositordemo
	module2 /boot/initrd
	set gfxpayload=1920x1080x32,1280x720x32,1024x768x32,800x600x32,1024x768,800x600
}
