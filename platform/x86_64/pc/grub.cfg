set timeout=1
set default=0

insmod vbe
insmod vga
insmod video_bochs
insmod video_cirrus

set gfxmode=1920x1080

# Drive both the graphical framebuffer and the serial console (COM1, 115200),
# so GRUB is visible over serial for headless / Proxmox-style serial setups as
# well as on a monitor.
serial --unit=0 --speed=115200
insmod gfxterm
terminal_input console serial
terminal_output gfxterm serial


menuentry "Cardinal" {
	multiboot2 /boot/kernel.bin
	module2 /boot/initrd
	set gfxpayload=1920x1080,1366x768,1280x720,1024x768,800x600,640x480
	#set gfxpayload=640x480
}
