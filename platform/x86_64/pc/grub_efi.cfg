insmod part_msdos

# Wide countdown so the serial control script has ample time to detect the menu
# over the (latency-prone) wireless bridge and send down-arrow + Enter to pick
# the debug entry. The first keypress stops the countdown, so this only delays
# fully-unattended boots (send Enter over serial to boot the default sooner).
set timeout=15
set default=0

insmod vbe
insmod vga
insmod video_bochs
insmod video_cirrus
insmod efi_gop
insmod efi_uga

insmod font

set gfxmode=1920x1080,1366x768,1280x720,1024x768,1024x600,800x600,640x480

# Serial console (COM1, 115200) in addition to the graphical framebuffer, so
# output is visible over serial on headless UEFI hardware (e.g. the AtomicPi,
# reached over its UART) as well as on a monitor. terminal_input is console-ONLY
# on purpose: this board's serial link is noisy at power-on, and if that RX noise
# were taken as keystrokes it would cancel the auto-boot countdown and strand
# GRUB at the menu. (The video insmods above are load-bearing: GRUB needs one to
# set the gfxpayload framebuffer it hands to Cardinal, which is graphics-only.)
insmod serial
serial --unit=0 --speed=115200 --word=8 --parity=no --stop=1
insmod gfxterm
# Accept input from BOTH the local console and serial, so the boot mode can be
# selected over the serial bridge (press 'd' for the debug-shell entry). The
# default entry still auto-boots after the timeout for unattended boots; serial
# RX noise can cancel that countdown and leave GRUB at the menu, in which case
# send a newline to boot the default.
terminal_input console serial
terminal_output gfxterm serial

menuentry "Cardinal" {
	multiboot2 /boot/kernel.bin
	module2 /boot/initrd
	set gfxpayload=1920x1080,1366x768,1280x720,1024x768,1024x600,800x600,640x480
	#set gfxpayload=640x480
}

# Same kernel, but with the cardinal.debugshell flag so servicescript drops into
# the interactive debug shell (peek/poke over serial) at end of boot. Selectable
# over serial via its hotkey 'd' -- no reflash needed to switch modes.
menuentry "Cardinal (debug shell)" --hotkey=d {
	multiboot2 /boot/kernel.bin cardinal.debugshell
	module2 /boot/initrd
	set gfxpayload=1920x1080,1366x768,1280x720,1024x768,1024x600,800x600,640x480
}
