set timeout=0
set default=0

insmod vbe
insmod vga
insmod video_bochs
insmod video_cirrus

# Force a 32-bit-per-pixel framebuffer (x32 depth): the graphics library and lfb
# assume 4-byte pixels, so a 24bpp mode (pitch = width*3) would mis-stride.
set gfxmode=1920x1080x32

serial --unit=0 --speed=115200
insmod gfxterm
terminal_input console serial
terminal_output gfxterm serial

# Boots with "cardinal.doom": after the display comes up, init brings up the
# window compositor OWNING the real scanout and runs the Doom WASM guest
# (guests/doom/doom.wasm, doomgeneric -> wasm32-wasi) on the in-OS interpreter,
# presenting its frames into a compositor surface (notes/core/wasm-guests.md
# phase 5). Requires lisp/data/doom1.wad in the initrd. Capture it with
# run-qemu.sh SCREENSHOT=.
menuentry "Cardinal (Doom)" {
	multiboot2 /boot/kernel.bin cardinal.doom
	module2 /boot/initrd
	set gfxpayload=1920x1080x32,1280x720x32,1024x768x32,800x600x32,1024x768,800x600
}
