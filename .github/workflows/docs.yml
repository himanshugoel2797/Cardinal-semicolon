# Build the Cardinal; documentation site from docs/api/*.md and publish it to
# GitHub Pages. This is source-derived only -- it runs the Python extractor +
# site generator, NOT the C/kernel build (no toolchain, no QEMU).
name: docs

on:
  push:
    branches: [master]
  workflow_dispatch:

# Permissions are scoped per job below: the build/extract job only reads the
# repo; only the deploy job gets the Pages write + id-token (required by
# deploy-pages) needed to publish.

# Only one Pages deployment at a time; let an in-progress run finish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Extract docs database (build/docs/db.json + lisp/docs-db.clp)
        run: python3 scripts/docs/extract.py

      - name: Render static site (_site/)
        run: python3 scripts/docs/gen_site.py

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
